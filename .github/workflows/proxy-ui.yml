name: Proxy UI

# Type-checks and builds the proxy's React UI. Runs only when the UI source
# (or this workflow) changes.
on:
  pull_request:
    paths:
      - 'proxy/ui-src/**'
      - '!proxy/ui-src/README.md'
      - '.github/workflows/proxy-ui.yml'
  push:
    branches: [main]
    paths:
      - 'proxy/ui-src/**'
      - '!proxy/ui-src/README.md'
      - '.github/workflows/proxy-ui.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy/ui-src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proxy/ui-src/package-lock.json
      - run: npm ci
      # tsc --noEmit && vite build
      - run: npm run build
      - run: npm test

  # Browser tests against the built UI with the proxy API faked (proxy/ui-src/ui-tests).
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy/ui-src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proxy/ui-src/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: proxy/ui-src/playwright-report/
          retention-days: 7
